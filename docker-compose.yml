services:
  parser:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      LOG_DIR: /app/logs
    volumes:
      # Persist jobs, audit log, uploads, idempotency DB across restarts
      - parser-logs:/app/logs
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - parser
    restart: unless-stopped

volumes:
  parser-logs:
  caddy-data:
  caddy-config:
